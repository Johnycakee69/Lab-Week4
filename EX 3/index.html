<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Sono", sans-serif;
        margin: 0;
        padding: 40px 20px;
        background: #f0f2f8;
      }

      .pricing-container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: stretch;
        gap: 30px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .pricing-plan {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        padding-bottom: 30px;
      }

      .plan-title {
        width: 100%;
        padding: 22px;
        text-align: center;
        color: #fff;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #14c8b4, #2cd0c0);
      }
      .pricing-plan:nth-child(2) .plan-title {
        background: linear-gradient(90deg, #1ea0f0, #5b5bea);
      }
      .pricing-plan:nth-child(3) .plan-title {
        background: linear-gradient(90deg, #8a3fe0, #e32ca8);
      }

      .plan-price {
        font-size: 1.6rem;
        font-weight: 700;
        color: #4a3f7a;
        padding: 30px 20px 10px;
      }

      .plan-features {
        list-style: none;
        padding: 0 24px;
        margin: 10px 0 30px;
        width: 100%;
        flex: 1;
      }
      .plan-features li {
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        font-size: 0.85rem;
        color: #555;
      }

      .plan-button {
        border: none;
        border-radius: 30px;
        padding: 12px 40px;
        color: #fff;
        font-family: inherit;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(90deg, #14c8b4, #2cd0c0);
      }
      .pricing-plan:nth-child(2) .plan-button {
        background: linear-gradient(90deg, #1ea0f0, #5b5bea);
      }
      .pricing-plan:nth-child(3) .plan-button {
        background: linear-gradient(90deg, #8a3fe0, #e32ca8);
      }

      /* Stack the plans vertically on smaller screens */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
          max-width: 420px;
        }
        .pricing-plan {
          flex: none;
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
